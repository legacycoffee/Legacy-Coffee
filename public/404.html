<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting | Legacy Coffee</title>
  </head>
  <body>
    <script>
      const isCustomDomain = ['legacycoffee.org', 'www.legacycoffee.org'].includes(
        window.location.hostname.toLowerCase(),
      )
      const requestedPath = window.location.pathname + window.location.search + window.location.hash

      if (isCustomDomain) {
        const appPath = window.location.pathname.replace(/^\/Legacy-Coffee(?=\/|$)/i, '') || '/'
        sessionStorage.setItem(
          'gh-pages-redirect',
          appPath + window.location.search + window.location.hash,
        )
        window.location.replace('/')
      } else {
        sessionStorage.setItem('gh-pages-redirect', requestedPath)
        window.location.replace('/Legacy-Coffee/')
      }
    </script>
    <p>Redirecting to Legacy Coffee...</p>
  </body>
</html>
